<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b7f5a">
<title>伸託ツール</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f6f8;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; flex: none;
    padding-top: env(safe-area-inset-top); }
  nav button { flex: 1; padding: 13px 4px; border: 0; background: none; cursor: pointer;
    font-size: 14px; color: #6b7280; font-family: inherit; }
  nav button.on { color: #1f2328; font-weight: 700; box-shadow: inset 0 -3px 0 #1b7f5a; }
  #f { flex: 1; width: 100%; border: 0; display: block; }
</style>
</head>
<body>
<nav>
  <button data-a="find" class="on">モノ探し</button>
  <button data-a="hunt">PC編</button>
  <button data-a="">リマインド</button>
</nav>
<iframe id="f" allow="clipboard-write"></iframe>

<script>
var BASE = 'https://script.google.com/macros/s/AKfycbywNo6A5fN97_lNhcJZoEDMprsY0FaHd1hOH6fuxmg-2UiDXRo0a9My_ZnYGISvwNLjqQ/exec';
var BTNS = [].slice.call(document.querySelectorAll('nav button'));

function go(a) {
  document.getElementById('f').src = BASE + (a ? '?app=' + a : '');
}
function mark(a) {
  BTNS.forEach(function (b) { b.className = (b.dataset.a === a) ? 'on' : ''; });
}
BTNS.forEach(function (b) {
  b.onclick = function () {
    mark(b.dataset.a);
    go(b.dataset.a);
    try { localStorage.setItem('tab', b.dataset.a); } catch (e) {}
  };
});

var t = null;
try { t = localStorage.getItem('tab'); } catch (e) {}
if (t === null) t = 'find';
mark(t);
go(t);
</script>
</body>
</html>
