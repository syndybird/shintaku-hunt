<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f4ee">
<title>伸託ツール</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f4ee;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; background: #fff; border-bottom: 1px solid #e6e0d6; flex: none;
    padding-top: env(safe-area-inset-top); }
  nav button { flex: 1; padding: 13px 4px; border: 0; background: none; cursor: pointer;
    font-size: 14px; color: #78706a; font-family: inherit; }
  nav button.on { color: #1f3a63; font-weight: 700; box-shadow: inset 0 -3px 0 #1f3a63; }
  #f { flex: 1; width: 100%; border: 0; display: block; background: #f7f4ee; }
</style>
</head>
<body>
<nav>
  <button data-a="find">モノ探し</button>
  <button data-a="hunt">PC編</button>
  <button data-a="">リマインド</button>
</nav>
<iframe id="f" allow="clipboard-write"></iframe>

<script>
var BASE = 'https://script.google.com/macros/s/AKfycbywNo6A5fN97_lNhcJZoEDMprsY0FaHd1hOH6fuxmg-2UiDXRo0a9My_ZnYGISvwNLjqQ/exec';
var BTNS = [].slice.call(document.querySelectorAll('nav button'));

// ハッシュ（#find / #hunt / #remind）とアプリ名の対応
var BY_HASH = { find: 'find', hunt: 'hunt', remind: '', reminder: '' };
var TO_HASH = { find: 'find', hunt: 'hunt', '': 'remind' };

function fromHash() {
  var h = (location.hash || '').replace(/^#/, '');
  return Object.prototype.hasOwnProperty.call(BY_HASH, h) ? BY_HASH[h] : null;
}
function go(a) {
  document.getElementById('f').src = BASE + (a ? '?app=' + a : '');
}
function mark(a) {
  BTNS.forEach(function (b) { b.className = (b.dataset.a === a) ? 'on' : ''; });
}
function show(a, push) {
  mark(a);
  go(a);
  try { localStorage.setItem('tab', a); } catch (e) {}
  if (push) {
    var h = '#' + TO_HASH[a];
    if (location.hash !== h) {
      if (history.replaceState) history.replaceState(null, '', h);
      else location.hash = h;
    }
  }
}

BTNS.forEach(function (b) {
  b.onclick = function () { show(b.dataset.a, true); };
});

window.addEventListener('hashchange', function () {
  var a = fromHash();
  if (a !== null) show(a, false);
});

var start = fromHash();
if (start === null) {
  try { start = localStorage.getItem('tab'); } catch (e) {}
  if (start === null) start = 'find';
}
show(start, true);
</script>
</body>
</html>
